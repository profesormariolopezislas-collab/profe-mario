<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengua Adicional II - Profe Mario</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .header { background: #1a73e8; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(26,115,232,0.2); }
        h2 { margin: 0; font-size: 22px; }
        .student-info { font-weight: 300; opacity: 0.9; margin-top: 5px; }
        .empty-state { text-align: center; color: #5f6368; margin-top: 50px; padding: 20px; }
        .btn-logout { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <h2 id="welcome">Welcome...</h2>
    <div class="student-info">Group: Lengua Adicional II</div>
    <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<div class="card" style="background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <div class="activity-info">
        <h3 style="margin: 0; font-size: 16px; color: #3c4043;">Unit 2: Grammar 2</h3>
        <p style="margin: 5px 0 0; font-size: 12px; color: #70757a;">Object Pronouns Practice</p>
    </div>
    <a href="L2/unit2_grammar2.html" style="background: #1a73e8; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 14px;">Start</a>
</div>

    

<script>
    const name = localStorage.getItem('userName') || "Student";
    document.getElementById('welcome').innerText = "Welcome, " + name;

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
