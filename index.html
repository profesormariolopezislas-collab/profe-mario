<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profe Mario - Welcome</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        h1 { color: #1a73e8; margin-bottom: 5px; font-size: 28px; }
        p { color: #5f6368; margin-bottom: 25px; font-size: 14px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #e8eaed; border-radius: 8px; font-size: 16px; outline: none; }
        button { background-color: #1a73e8; color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Profe Mario Web</h1>
    <p>Activity Portal</p>
    <input type="text" id="lastName" placeholder="Last Name" autocomplete="family-name">
    <input type="text" id="firstName" placeholder="First Name" autocomplete="given-name">
    <select id="groupSelect">
        <option value="" disabled selected>Select your group</option>
        <option value="lengua2.html">Lengua Adicional II</option>
        <option value="lengua4.html">Lengua Adicional IV</option>
        <option value="ingles_av2.html">Inglés Avanzado II</option>
        <option value="neuro.html">Evaluación Neuropsicologíca</option>
    </select>
    <button onclick="startSession()">Enter Class</button>
</div>
<script>
    function startSession() {
        const ln = document.getElementById('lastName').value.trim();
        const fn = document.getElementById('firstName').value.trim();
        const target = document.getElementById('groupSelect').value;
        if(ln && fn && target) {
            localStorage.setItem('userName', fn + " " + ln);
            window.location.href = target;
        } else { alert("Please fill in all fields."); }
    }
</script>
</body>
</html>
